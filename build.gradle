plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = 'GeckoLib'
		url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
		content { includeGroup('software.bernie.geckolib') }
	}
	maven {
		name = 'AzureLib'
		url = 'https://dl.cloudsmith.io/public/azuredoom-mods/azurelib/maven/'
		content { includeGroup('mod.azure.azurelib') }
	}
	maven {
		name = "KosmX's maven"
		url = 'https://maven.kosmx.dev/'
	}
	maven { url 'https://maven.fabricmc.net/' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jjk" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:1.21.1"
	mappings "net.fabricmc:yarn:1.21.1+build.3:v2"
	modImplementation "net.fabricmc:fabric-loader:0.16.5"
	modImplementation "net.fabricmc.fabric-api:fabric-api:0.110.0+1.21.1"

	testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
	testImplementation "org.junit.jupiter:junit-jupiter-engine:5.10.0"
	testImplementation "org.junit.platform:junit-platform-launcher:1.10.0"

	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.8.3"
	// modImplementation "mod.azure.azurelib:azurelib-fabric-1.21.1:3.0.27"
	modImplementation("dev.kosmx.player-anim:player-animation-lib-fabric") {
		version { strictly "2.0.4+1.21.1" }
	}
	implementation include("org.xerial:sqlite-jdbc:3.45.1.0")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "projectName", project.name

	from("LICENSE") {
		rename { "${it}_${project.name}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

test {
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
}
